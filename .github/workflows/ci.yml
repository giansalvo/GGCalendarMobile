name: CI

on:
  push:
    branches: [main]
    # The plan, mockups and other documents do not affect the build.
    paths-ignore: ["app_planning/**", "**.md", "img/**"]
  pull_request:
    paths-ignore: ["app_planning/**", "**.md", "img/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No signed binaries or secrets in the repository
        run: |
          # Signed APKs, keystores and OAuth secrets must never be tracked, even if added with "git add -f".
          bad=$(git ls-files | grep -E '\.(apk|aab|apks|jks|keystore|p12|pem)$|(^|/)keystore\.properties$|(^|/)client_secret.*\.json$|(^|/)google-services\.json$|^dist/|^OAuth/|^tools/emutest/runs/' || true)
          if [ -n "$bad" ]; then echo "Tracked files that must stay local:"; echo "$bad"; exit 1; fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, unit tests, debug build
        run: ./gradlew lint test assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
